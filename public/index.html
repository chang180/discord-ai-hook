<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discord AI Labs Watcher — 測試台</title>
  <style>
    :root {
      --bg: #1e1f22;
      --panel: #2b2d31;
      --text: #dbdee1;
      --muted: #949ba4;
      --accent: #5865f2;
      --warn: #f0b232;
      --danger: #ed4245;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
      line-height: 1.5;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    .sub { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.secondary { background: var(--panel); border: 1px solid #3f4147; }
    .status { font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }
    .status.error { color: var(--danger); }
    section { margin-bottom: 2rem; }
    h2 { font-size: 1rem; color: var(--muted); margin-bottom: 0.75rem; }
    .source-block {
      border: 1px solid #3f4147;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #232428;
    }
    .source-block h3 {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      color: var(--text);
    }
    .source-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.75rem; }
    .card {
      background: var(--panel);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      border: 1px solid #3f4147;
    }
    .card h4 { margin: 0 0 0.5rem; font-size: 0.9rem; }
    .meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
    .meta.warn { color: var(--warn); }
    .meta.danger { color: var(--danger); }
    pre.discord-preview {
      background: #313338;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.85rem;
      margin: 0.5rem 0;
      border-left: 3px solid var(--accent);
    }
    .empty { color: var(--muted); font-style: italic; font-size: 0.9rem; }
    .filtered-section { margin-top: 0.5rem; }
    details { margin-top: 0.5rem; }
    summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Discord AI Labs Watcher</h1>
  <p class="sub">依來源分區預覽 — 每來源最多 3 則（與 Discord 實際 <code>content</code> 相同）</p>

  <div class="toolbar">
    <button type="button" id="btnPreview">載入預覽</button>
    <button type="button" id="btnDryRun" class="secondary">Dry Run（不發送）</button>
  </div>
  <p class="status" id="status">就緒 — 點「載入預覽」從各消息源抓取（不會發送到 Discord）</p>

  <section>
    <h2>將發送（<span id="sendCount">0</span> 則，最多 9）</h2>
    <div id="wouldSendBySource"></div>
  </section>

  <section>
    <h2>已過濾（<span id="filteredCount">0</span>）</h2>
    <div id="filteredBySource"></div>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);

    function setStatus(msg, isError) {
      $("status").textContent = msg;
      $("status").className = isError ? "status error" : "status";
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderMessageCard(item, showSend) {
      const len = item.content.length;
      const over = len > 2000;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <h4>${escapeHtml(item.article.title)}</h4>
        <div class="meta">${escapeHtml(item.article.source)} · ${len} 字元${over ? ' · <span class="danger">超過 2000</span>' : ""}</div>
        <pre class="discord-preview">${escapeHtml(item.content)}</pre>
        <button type="button" class="secondary btn-copy">複製 content</button>
      `;
      card.querySelector(".btn-copy").onclick = () => {
        navigator.clipboard.writeText(item.content);
        setStatus("已複製到剪貼簿");
      };
      return card;
    }

    function renderPreview(data) {
      const sendRoot = $("wouldSendBySource");
      const filtRoot = $("filteredBySource");
      sendRoot.innerHTML = "";
      filtRoot.innerHTML = "";

      $("sendCount").textContent = data.wouldSend?.length ?? 0;
      $("filteredCount").textContent = data.filtered?.length ?? 0;

      const slices = data.bySource?.length ? data.bySource : [];

      if (!slices.length) {
        sendRoot.innerHTML = '<p class="empty">無 bySource 資料</p>';
        return;
      }

      for (const slice of slices) {
        const block = document.createElement("div");
        block.className = "source-block";
        const truncNote = slice.truncated
          ? ` · 尚有 ${Math.max(0, slice.passedCount - slice.wouldSend.length)} 則通過但未顯示`
          : "";
        block.innerHTML = `
          <h3>${escapeHtml(slice.label)}</h3>
          <div class="source-meta">將發送 ${slice.wouldSend.length} 則 · 已過濾 ${slice.filtered.length} 則${truncNote}</div>
        `;
        const list = document.createElement("div");
        if (!slice.wouldSend.length) {
          list.innerHTML = '<p class="empty">此來源無符合條件的文章</p>';
        } else {
          for (const item of slice.wouldSend) {
            list.appendChild(renderMessageCard(item));
          }
        }
        block.appendChild(list);

        if (slice.filtered.length) {
          const det = document.createElement("details");
          det.className = "filtered-section";
          det.innerHTML = `<summary>顯示已過濾 (${slice.filtered.length})</summary>`;
          const inner = document.createElement("div");
          for (const item of slice.filtered) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              <h4>${escapeHtml(item.article.title)}</h4>
              <div class="meta warn">${escapeHtml(item.reason)}</div>
            `;
            inner.appendChild(card);
          }
          det.appendChild(inner);
          block.appendChild(det);
        }

        sendRoot.appendChild(block);
      }

      const otherFiltered = (data.filtered || []).filter(
        (f) => !slices.some((s) => s.source === f.article.source),
      );
      if (otherFiltered.length) {
        filtRoot.innerHTML = "<p class=\"empty\">（其餘過濾項已分至各來源）</p>";
      }
    }

    async function fetchJson(url, opts) {
      const res = await fetch(url, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    async function loadPreview() {
      setStatus("正在從各消息源抓取並預覽…");
      try {
        const data = await fetchJson("/api/preview");
        renderPreview(data);
        const summary = (data.bySource || [])
          .map((s) => `${s.label}: ${s.wouldSend.length}`)
          .join(" · ");
        setStatus(`預覽完成（未發送 Discord）— ${summary}`);
      } catch (e) {
        setStatus(e.message, true);
      }
    }

    async function runDryRun() {
      setStatus("Dry run 中（不發送）…");
      try {
        const data = await fetchJson("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ dryRun: true }),
        });
        renderPreview(data);
        setStatus(`Dry run 完成 — 共 ${data.wouldSend?.length ?? 0} 則，未發送`);
      } catch (e) {
        setStatus(e.message, true);
      }
    }

    $("btnPreview").onclick = loadPreview;
    $("btnDryRun").onclick = runDryRun;
  </script>
</body>
</html>
